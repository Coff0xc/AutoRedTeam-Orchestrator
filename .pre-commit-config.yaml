# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install

repos:
  # Black code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        args: ['--line-length=100']
        language_version: python3

  # isort import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # flake8 code linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=100', '--extend-ignore=E501,W503,E402,E203']
        additional_dependencies:
          - flake8-bugbear

  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  # Local hooks
  - repo: local
    hooks:
      # Check for hardcoded paths (cross-platform compatibility)
      - id: check-hardcoded-paths
        name: Check for hardcoded Unix paths
        entry: python scripts/check_paths.py
        language: python
        files: \.py$
        pass_filenames: true
