name: 'AutoRedTeam Surface Audit'
description: 'Local MCP/AI attack-surface audit and evidence gate for authorized testing'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  mode:
    description: 'Mode: self-audit (static AI/MCP surface scan of this repo) | target-scan (active scan of an authorized URL). The default is self-audit.'
    required: false
    default: 'self-audit'
  target:
    description: 'Target URL to scan (required for target-scan mode)'
    required: false
    default: ''
  path:
    description: 'Path to audit in self-audit mode (relative to repo root)'
    required: false
    default: '.'
  scan-type:
    description: 'Scan type for target-scan: detect | recon | full'
    required: false
    default: 'detect'
  categories:
    description: 'Detection categories (comma-separated): sqli,xss,ssrf,...'
    required: false
    default: ''
  severity-threshold:
    description: 'Minimum severity to fail: info/low/medium/high/critical'
    required: false
    default: 'high'
  output-format:
    description: 'Output format: json | sarif'
    required: false
    default: 'sarif'
  baseline:
    description: 'Optional JSON from a prior ai-surface scan. When set, self-audit also runs diff --ci.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install AutoRedTeam
      shell: bash
      run: |
        pip install -r ${{ github.action_path }}/requirements.txt
        pip install typer

    - name: Run Scan
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_SEVERITY: ${{ inputs.severity-threshold }}
        INPUT_CATEGORIES: ${{ inputs.categories }}
        INPUT_BASELINE: ${{ inputs.baseline }}
      run: |
        set -e
        OUT="$GITHUB_WORKSPACE/results.sarif"
        if [ "$INPUT_MODE" = "self-audit" ]; then
          # Static self-audit: scan the calling repo's AI/MCP attack surface; no target or network needed
          case "$INPUT_PATH" in
            /*) SCAN_PATH="$INPUT_PATH" ;;
            *)  SCAN_PATH="$GITHUB_WORKSPACE/$INPUT_PATH" ;;
          esac
          PYTHONPATH="${{ github.action_path }}" python -m cli.main ai-surface scan \
            --path "$SCAN_PATH" \
            --format "$INPUT_FORMAT" \
            --severity-threshold "$INPUT_SEVERITY" \
            --exit-code \
            -o "$OUT"
          if [ -n "$INPUT_BASELINE" ]; then
            case "$INPUT_BASELINE" in
              /*) BASELINE_PATH="$INPUT_BASELINE" ;;
              *)  BASELINE_PATH="$GITHUB_WORKSPACE/$INPUT_BASELINE" ;;
            esac
            PYTHONPATH="${{ github.action_path }}" python -m cli.main ai-surface diff \
              --baseline "$BASELINE_PATH" \
              --path "$SCAN_PATH" \
              --ci
          fi
        else
          # Active scan: only for authorized external targets
          if [ -z "$INPUT_TARGET" ]; then
            echo "target-scan mode requires the 'target' input" >&2
            exit 2
          fi
          cd "${{ github.action_path }}"
          ARGS="--ci --format $INPUT_FORMAT --severity-threshold $INPUT_SEVERITY --exit-code"
          if [ -n "$INPUT_CATEGORIES" ]; then
            ARGS="$ARGS -c $INPUT_CATEGORIES"
          fi
          python -m cli.main detect "$INPUT_TARGET" $ARGS -o "$OUT"
        fi

    - name: Upload SARIF
      if: always() && inputs.output-format == 'sarif'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: results.sarif
